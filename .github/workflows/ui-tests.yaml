# UI tests (tests/testthat/test-ui-*.R): the app in headless Chrome, driven by
# shinytest2. R CMD check skips them on CI (see tests/testthat/helper-app.R);
# this job runs them against the installed package, as R CMD check would, and
# uploads each test's app log, shown tab and screenshot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      filter:
        description: "testthat filter: which UI test files to run"
        default: "^ui-"

name: ui-tests.yaml

permissions: read-all

jobs:
  ui-tests:
    runs-on: ${{ matrix.config.os }}

    name: UI tests ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest}
          - {os: macos-latest}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # As in R-CMD-check.yaml: Bioconductor 3.24 until it is the release.
      R_BIOC_VERSION: "3.24"
      NOT_CRAN: true
      EXPLOREDE_UI_TESTS: true
      EXPLOREDE_UI_ARTIFACTS: ${{ github.workspace }}/ui-artifacts

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # As in R-CMD-check.yaml: P3M serves macOS binaries pak can extract.
          use-public-rspm: always

      # As in R-CMD-check.yaml: the gdtools macOS binary needs XQuartz.
      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Profile the app's R process
        run: |
          mkdir -p "$EXPLOREDE_UI_ARTIFACTS"
          cp .github/ui-tests-Rprofile.R "$(Rscript -e 'cat(system.file("app", package = "exploreDE"))')/.Rprofile"

      - name: Run UI tests
        env:
          UI_TEST_FILTER: ${{ inputs.filter || '^ui-' }}
        run: |
          Rscript -e 'testthat::test_dir("tests/testthat", package = "exploreDE", load_package = "installed", filter = Sys.getenv("UI_TEST_FILTER"), stop_on_failure = TRUE)'

      - name: Upload app logs, tab states and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts-${{ runner.os }}
          path: ui-artifacts
          if-no-files-found: warn
