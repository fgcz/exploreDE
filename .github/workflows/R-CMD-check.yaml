# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Runs R CMD check (which runs the testthat suite) on pushes to main and on
# pull requests, so changes are validated before they land upstream.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}
          - {os: macos-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Bioconductor 3.24 (devel until 2026-11-25) ships anndataR >= 1.3, which
      # exploreDE needs; 3.23 has 1.2.3. Drop this once 3.24 is the release.
      R_BIOC_VERSION: "3.24"

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # "always" also routes macOS through Posit Package Manager. Workaround:
          # CRAN's macOS builder now ships zstd-compressed .tgz binaries, which the
          # pak/pkgdepends version this action installs cannot extract
          # (https://github.com/r-lib/pkgdepends/issues/485). P3M still serves gzip.
          # Revert to "true" once pkgdepends understands zstd archives.
          use-public-rspm: always

      # The gdtools macOS binary links against XQuartz (/opt/X11/lib/libXrender.1.dylib),
      # which GitHub's macOS runners do not ship; without it the vignette build fails.
      - name: Install XQuartz
        if: runner.os == 'macOS'
        run: brew install --cask xquartz

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      - name: Run goodpractice report
        if: ${{ always() && runner.os == 'Linux' }}
        continue-on-error: true
        run: |
          mkdir -p goodpractice-report
          Rscript -e 'pkgload::load_all(quiet = TRUE); result <- goodpractice::gp("."); print(result); saveRDS(result, "goodpractice-report/result.rds")' \
            > goodpractice-report/report.txt 2>&1

      - name: Upload goodpractice report
        if: ${{ always() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v4
        with:
          name: goodpractice-${{ runner.os }}-R-${{ matrix.config.r }}
          path: goodpractice-report
          if-no-files-found: warn
